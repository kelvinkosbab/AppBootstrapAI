name: shellcheck

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'lib/**.sh'
      - 'scripts/**.sh'
      - '.github/scripts/**.sh'
      - '.github/workflows/shellcheck.yml'
  # Pull requests run this through ci.yml, which skips it when no matching
  # path changed and gates merging on one required check.
  workflow_call:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          SHELLCHECK_OPTS: -e SC2155
        with:
          scandir: '.'
          format: gcc
          severity: warning
