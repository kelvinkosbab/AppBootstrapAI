name: shellcheck

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - '.github/scripts/**.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - 'install.sh'
      - '.github/scripts/**.sh'
      - '.github/workflows/shellcheck.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -e SC2155
        with:
          scandir: '.'
          format: gcc
          severity: warning
