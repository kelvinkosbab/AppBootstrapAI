name: release

# Push a SemVer tag (v1.2.3) to publish a GitHub release. The tag must have a
# matching `## [1.2.3] - YYYY-MM-DD` section in CHANGELOG.md, and every check
# must pass on the tagged commit before the release is created. The
# /appbootstrap-sync and /appbootstrap-audit commands clone the latest tag, so
# a tag is what adopters get.
#
# The same tag publishes @kelvinkosbab/appbootstrap-mcp to npm at the tag's
# version, with the bundle packed inside. That needs an NPM_TOKEN repository
# secret (an npm automation token); without it the npm job skips with a
# warning and the GitHub release still goes out.
#
# To finish a release that already exists (for example, to publish to npm
# after adding the secret), run this workflow by hand and pick the tag under
# "Use workflow from". Steps that already happened are skipped.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.notes.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: notes
        name: Extract the CHANGELOG section for this tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Run this workflow from a vX.Y.Z tag, not '$GITHUB_REF_NAME'"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  frontmatter:
    uses: ./.github/workflows/frontmatter.yml
  smoke-test:
    uses: ./.github/workflows/install-smoke-test.yml
  mcp-server:
    uses: ./.github/workflows/mcp-server.yml
  python:
    uses: ./.github/workflows/python.yml
  shellcheck:
    uses: ./.github/workflows/shellcheck.yml
  swift:
    uses: ./.github/workflows/swift.yml

  publish:
    needs: [changelog, frontmatter, smoke-test, mcp-server, python, shellcheck, swift]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.changelog.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME already exists; leaving it as is"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AppBootstrapAI $VERSION" \
            --notes-file release-notes.md \
            --verify-tag

  npm:
    needs: [changelog, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    defaults:
      run:
        working-directory: mcp-server
    env:
      PACKAGE: '@kelvinkosbab/appbootstrap-mcp'
      VERSION: ${{ needs.changelog.outputs.version }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - id: token
        name: Check for the NPM_TOKEN secret
        working-directory: .
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::warning::NPM_TOKEN is not set, so $PACKAGE was not published. Add the secret and re-run this workflow from $GITHUB_REF_NAME."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4

      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - id: existing
        if: steps.token.outputs.present == 'true'
        name: Skip a version that is already on npm
        run: |
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PACKAGE@$VERSION is already on npm"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.existing.outputs.published == 'false'
        name: Install dependencies
        run: npm ci

      - if: steps.existing.outputs.published == 'false'
        name: Set the package version from the tag
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - if: steps.existing.outputs.published == 'false'
        name: Publish (prepack builds dist/ and packs the bundle)
        run: npm publish --provenance --access public
