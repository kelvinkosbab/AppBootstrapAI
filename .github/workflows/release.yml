name: release

# Push a SemVer tag (v1.2.3) to publish a GitHub release. The tag must have a
# matching `## [1.2.3] - YYYY-MM-DD` section in CHANGELOG.md, and every check
# must pass on the tagged commit before the release is created. The
# /appbootstrap-sync and /appbootstrap-audit commands clone the latest tag, so
# a tag is what adopters get.
#
# The same tag publishes @kelvinkosbab/appbootstrap-mcp to npm when
# mcp-server/package.json carries a version npm doesn't have yet. It uses npm
# trusted publishing (OIDC) when the package is configured for it on npmjs.com,
# otherwise the NPM_TOKEN secret. With neither set up, this job fails after the
# GitHub release is already out; re-run it once publishing is configured.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.notes.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: notes
        name: Extract the CHANGELOG section for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  frontmatter:
    uses: ./.github/workflows/frontmatter.yml
  smoke-test:
    uses: ./.github/workflows/install-smoke-test.yml
  mcp-server:
    uses: ./.github/workflows/mcp-server.yml
  python:
    uses: ./.github/workflows/python.yml
  shellcheck:
    uses: ./.github/workflows/shellcheck.yml
  swift:
    uses: ./.github/workflows/swift.yml

  publish:
    needs: [changelog, frontmatter, smoke-test, mcp-server, python, shellcheck, swift]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.changelog.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AppBootstrapAI $VERSION" \
            --notes-file release-notes.md \
            --verify-tag

  npm-publish:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json
      - name: Skip versions npm already has
        id: check
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: npm ci
      - name: Publish (bundles the tagged tree via prepack)
        if: steps.check.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # npm >= 11.5 is needed for trusted publishing; Node 22 ships npm 10.
          npm install -g npm@latest
          npm publish --provenance --access public
