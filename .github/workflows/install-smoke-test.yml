name: install-smoke-test

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'lib/**'
      - 'templates/**'
      - '.claude/**'
      - 'mcp-recipes/**'
      - 'RENAMES.md'
      - 'scripts/**'
      - '.github/scripts/install-smoke-test.sh'
      - '.github/scripts/smoke/**'
      - '.github/workflows/install-smoke-test.yml'
  # Pull requests run this through ci.yml, which skips it when no matching
  # path changed and gates merging on one required check.
  workflow_call:

jobs:
  smoke-test:
    # Run on Ubuntu and macOS — the installer ships to both kinds of dev
    # machines and bash arithmetic / tempdir layout differ between them.
    # One job per part (.github/scripts/smoke/), so a failure names the area
    # that broke and the parts run in parallel.
    name: smoke (${{ matrix.part }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        part: [install, agents, categories, upgrade, uninstall, audit, scaffold]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke test part
        run: bash .github/scripts/smoke/${{ matrix.part }}.sh
